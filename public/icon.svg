<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient (Vibrant Emerald to Deep Teal) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="45%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>

    <!-- Top Gloss Highlight -->
    <linearGradient id="glossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Soft Drop Shadow for Icon Elements -->
    <filter id="elementShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#064e3b" flood-opacity="0.35"/>
    </filter>

    <!-- Sparkle Glow -->
    <filter id="sparkleGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Subtle Outer Orbit Indicator Pattern -->
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Gold-Emerald Accent Gradient for Star -->
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <!-- Base Icon Squircle (iOS / Modern App standard corner radius) -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)"/>

  <!-- Subtle Top Inner Rim Highlight for depth -->
  <rect width="504" height="504" x="4" y="4" rx="112" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Upper Half Gloss Reflection -->
  <path d="M4 116 C 4 54, 54 4, 116 4 L 396 4 C 458 4, 508 54, 508 116 L 508 220 C 360 270, 160 250, 4 210 Z" fill="url(#glossGrad)"/>

  <!-- Outer Dotted Cycle Track (Represents Consumable Lifespan & Schedule) -->
  <circle cx="256" cy="256" r="172" fill="none" stroke="url(#orbitGrad)" stroke-width="3.5" stroke-dasharray="8 14" opacity="0.6"/>

  <!-- Main Symbol Group with Depth Shadow -->
  <g filter="url(#elementShadow)">
    <!-- Dual Synchronized Cycle Arrows (Exchange & Replenish) -->
    <!-- Top-Right to Bottom-Left Arrow Arc -->
    <path d="M 256 112 A 144 144 0 0 1 400 256 A 144 144 0 0 1 332 378" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="32" 
          stroke-linecap="round"/>
    
    <!-- Arrowhead 1 (Bottom Left) -->
    <polygon points="310,394 348,390 334,352" fill="#ffffff"/>

    <!-- Bottom-Left to Top-Right Arrow Arc -->
    <path d="M 256 400 A 144 144 0 0 1 112 256 A 144 144 0 0 1 180 134" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="32" 
          stroke-linecap="round"/>

    <!-- Arrowhead 2 (Top Right) -->
    <polygon points="202,118 164,122 178,160" fill="#ffffff"/>

    <!-- Center Motif: Minimalist Modern "Home" Silhouette (for Home Edition) -->
    <g transform="translate(256, 260)">
      <!-- House Roof & Chimney -->
      <path d="M -44 -6 L 0 -44 L 44 -6 L 32 -6 L 32 36 C 32 40, 28 44, 24 44 L -24 44 C -28 44, -32 40, -32 36 L -32 -6 Z" 
            fill="#ffffff" 
            opacity="0.95"/>
      <!-- Chimney -->
      <path d="M 18 -26 L 18 -38 L 28 -38 L 28 -17 Z" fill="#ffffff" opacity="0.95"/>
      <!-- Inner Refresh Heart/Leaf Accent Cutout -->
      <circle cx="0" cy="14" r="11" fill="#059669"/>
    </g>

    <!-- Top Right Sparkle Star (Cleanliness, Freshness & Renewal) -->
    <g transform="translate(378, 134)" filter="url(#sparkleGlow)">
      <path d="M 0 -24 Q 0 0 24 0 Q 0 0 0 24 Q 0 0 -24 0 Q 0 0 0 -24 Z" fill="url(#starGrad)"/>
      <circle cx="0" cy="0" r="4.5" fill="#ffffff"/>
    </g>

    <!-- Bottom Left Subtle Mini-Sparkle -->
    <g transform="translate(136, 376)">
      <path d="M 0 -13 Q 0 0 13 0 Q 0 0 0 13 Q 0 0 -13 0 Q 0 0 0 -13 Z" fill="#a7f3d0" opacity="0.85"/>
    </g>
  </g>
</svg>
